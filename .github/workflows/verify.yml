name: Verify Units 1 and 2
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-course-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build lint and test ten applications
        run: ./scripts/build-android.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch all ten apps and run the Tip Time UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./scripts/smoke-android.sh
            cd unit-02/tip-time
            ./gradlew --console=plain connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: units-01-02-emulator-evidence
          path: unit-*/evidence/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: units-01-02-debug-apks
          path: unit-*/*/app/build/outputs/apk/debug/*.apk
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin compiler
        run: |
          curl --fail --location --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo '/tmp/kotlin/kotlinc/bin' >> "$GITHUB_PATH"
      - name: Run all Kotlin exercises from both units
        run: python3 scripts/verify-kotlin.py
